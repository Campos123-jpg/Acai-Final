<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login administrativo | Divino Açaí</title>
  <link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script>
</head>
<body>
  <main class="login-wrapper">
    <form class="login-card" action="#" method="post">
      <a class="logo" href="index.html">Divino <span>Açaí</span></a><p class="eyebrow">Área restrita</p><h1>Entrar no painel</h1>
      <label for="email">E-mail</label><input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="username" required>
      <label for="password">Senha</label><input id="password" name="password" type="password" placeholder="Sua senha" autocomplete="current-password" required>
      <button class="button button-full" type="submit">Entrar</button>
      <p class="form-note">A autenticação será implementada em uma próxima etapa.</p><a class="text-link" href="index.html">Voltar para a loja</a>
    </form>
  </main>
</body>
</html>
